<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Universal Translator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef3f9;
      padding: 40px;
      color: #333;
    }
    h1 {
      color: #004080;
    }
    select, textarea, button {
      font-size: 16px;
      padding: 10px;
      margin-top: 10px;
      width: 100%;
      max-width: 500px;
    }
    .container {
      max-width: 600px;
      margin: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Universal Translator 🌍</h1>

    <label for="text">Enter text:</label><br>
    <textarea id="text" rows="5" placeholder="Type something to translate..."></textarea>

    <label for="language">Translate to:</label><br>
    <select id="language">
      <option value="hi">Hindi</option>
      <option value="fr">French</option>
      <option value="es">Spanish</option>
      <option value="de">German</option>
      <option value="ta">Tamil</option>
      <option value="zh-CN">Chinese (Simplified)</option>
      <option value="ar">Arabic</option>
      <option value="ru">Russian</option>
    </select>

    <button onclick="translateText()">Translate</button>
  </div>

  <script>
    function translateText() {
      const text = document.getElementById('text').value;
      const lang = document.getElementById('language').value;

      if (!text.trim()) {
        alert("Please enter some text to translate.");
        return;
      }

      const encodedText = encodeURIComponent(text);
      const url = `https://translate.google.com/?sl=auto&tl=${lang}&text=${encodedText}&op=translate`;

      window.open(url, '_blank');
    }
  </script>
</body>
</html>
